name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'charts/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  # Using the repository name as the base, will append -backend and -frontend
  IMAGE_BASE: ${{ github.repository }}

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'backend/go.mod'

      - name: Run Tests
        run: cd backend && go test -v ./...

  backend:
    name: Build & Push Backend
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_BASE }}-backend
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Run Trivy vulnerability scanner (FS)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build Backend (Local for Scan)
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          push: false
          tags: ${{ env.IMAGE_BASE }}-backend:scan
          cache-from: type=gha,scope=backend


      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_BASE }}-backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_BASE }}-frontend
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Run Trivy vulnerability scanner (FS)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend (Local for Scan)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          push: false
          tags: ${{ env.IMAGE_BASE }}-frontend:scan
          cache-from: type=gha,scope=frontend


      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_BASE }}-frontend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  create-release:
    name: Create GitHub Release
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: notes
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Find the previous tag that matches v*.*.* (excluding current tag)
          PREVIOUS_TAG=$(git tag --sort=-creatordate --list 'v*.*.*' | grep -v "^${CURRENT_TAG}$" | head -n 1)
          
          echo "Current Tag: $CURRENT_TAG"
          echo "Previous Tag: $PREVIOUS_TAG"
          export PREVIOUS_TAG

          python3 - << 'EOF'
          import subprocess
          import re
          import os

          current_tag = os.environ.get("CURRENT_TAG", "")
          previous_tag = os.environ.get("PREVIOUS_TAG", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          if previous_tag:
              rev_range = f"{previous_tag}..{current_tag}"
          else:
              rev_range = current_tag

          try:
              raw = subprocess.check_output(
                  ["git", "log", rev_range, "--pretty=format:%h%x09%s%x09%b%x1f"],
                  stderr=subprocess.DEVNULL
              ).decode("utf-8", errors="replace")
          except Exception:
              raw = ""

          features = []
          fixes = []
          maintenance = []
          breaking = []

          for commit in raw.split("\x1f"):
              commit = commit.strip()
              if not commit:
                  continue
              parts = commit.split("\x09")
              h = parts[0].strip()
              s = parts[1].strip() if len(parts) > 1 else ""
              b = parts[2].strip() if len(parts) > 2 else ""

              # Skip release preparation commits to avoid noise
              if re.match(r"^chore\(release\):", s, re.I):
                  continue

              item = f"- {s} (`{h}`)"

              if "BREAKING CHANGE:" in b or "BREAKING CHANGE:" in s or re.match(r"^\w+(\([\w\-\.]+\))?!:", s):
                  breaking.append(item)
              elif re.match(r"^feat(\([\w\-\.]+\))?:", s, re.I):
                  features.append(item)
              elif re.match(r"^fix(\([\w\-\.]+\))?:", s, re.I):
                  fixes.append(item)
              else:
                  maintenance.append(item)

          sections = []
          if breaking:
              sections.append("### ⚠️ Breaking Changes\n" + "\n".join(breaking))
          if features:
              sections.append("### 🚀 Features\n" + "\n".join(features))
          if fixes:
              sections.append("### 🐛 Bug Fixes\n" + "\n".join(fixes))
          if maintenance:
              sections.append("### 🧰 Maintenance & Refactoring\n" + "\n".join(maintenance))

          body = "\n\n".join(sections) if sections else "No notable changes."

          if previous_tag:
              body += f"\n\n**Full Changelog**: https://github.com/{repo}/compare/{previous_tag}...{current_tag}"
          else:
              body += f"\n\n**Full Changelog**: https://github.com/{repo}/commits/{current_tag}"

          with open("release_body.md", "w") as f:
              f.write(body + "\n")
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
